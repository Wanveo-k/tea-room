components:
- components:
  - data_bindings:
    - {code: 'self.item[''picture'']', property: source, writeback: false}
    layout_properties: {width: 208}
    name: image
    properties: {display_mode: original_size, height: 168, source: ''}
    type: Image
  - components:
    - data_bindings: []
      name: label_name
      properties: {}
      type: Label
    - data_bindings: []
      name: label_number_places
      properties: {}
      type: Label
    - layout_properties: {}
      name: label_message_date
      properties: {font_size: 9, italic: true, text: 'Please select a date, an hour and a duration:'}
      type: Label
    - layout_properties: {}
      name: date_picker_1
      properties: {pick_time: true, placeholder: Choose a date}
      type: DatePicker
    - layout_properties: {}
      name: drop_down_time_slots
      properties:
        include_placeholder: false
        items: [30 minutes, 1 hour, 1 hour 30 minutes, 2 hours]
        placeholder: Duration
      type: DropDown
    - components:
      - layout_properties: {grid_position: 'LWIMZR,XEAORJ'}
        name: label_message
        properties: {visible: false}
        type: Label
      - event_bindings: {click: validate_button_click}
        layout_properties: {grid_position: 'LWIMZR,HNXKXA'}
        name: validate_button
        properties: {align: right, icon: 'fa:check', text: Validate}
        type: Button
      layout_properties: {}
      name: column_panel_1
      properties: {col_widths: '{"XEAORJ":45,"HNXKXA":15}'}
      type: ColumnPanel
    layout_properties: {width: 611}
    name: linear_panel_1
    properties: {}
    type: LinearPanel
  layout_properties: {grid_position: 'AWLYAN,XFITMK'}
  name: flow_panel_1
  properties: {}
  type: FlowPanel
container: {type: ColumnPanel}
is_package: true
