components:
- components:
  - layout_properties: {width: 369}
    name: image_qrcode
    properties: {display_mode: original_size, height: 322}
    type: Image
  layout_properties: {grid_position: 'WSJKET,NIVTSD'}
  name: flow_panel_image
  properties: {align: center}
  type: FlowPanel
- components:
  - layout_properties: {}
    name: label_message
    properties:
      text: |-
        1. Scannez ce QR code avec une application d'authentification (par exemple : Google Authenticator, Microsoft Authenticator).

        2. L'application générera des codes temporaires à usage unique que vous utiliserez lors de vos connexions.

        ⚠️ Important : Conservez votre application d'authentification. Sans elle, vous ne pourrez plus accéder à votre compte.
    type: Label
  - event_bindings: {click: button_validate_click}
    layout_properties: {}
    name: button_validate
    properties: {icon: 'fa:check', text: Validate}
    type: Button
  layout_properties: {grid_position: 'TZBUAN,TQYBXK'}
  name: linear_panel
  properties: {}
  type: LinearPanel
container: {type: ColumnPanel}
is_package: true
